name: CI

# dev-guide.md §4「CI」の内容をそのまま実装する:
#   - go vet / golangci-lint
#   - go test（Postgresが必要な統合テストが実際に動くよう、サービスコンテナを使う）
#   - 生成コードの差分チェック（make gen && git diff --exit-code）
#
# PRブロック（issue #70 完了条件「PRの時点でも失敗時はマージをブロックできること」）は
# このワークフロー自体ではなく、GitHub側のブランチ保護ルールで「ci」ジョブを必須
# ステータスチェックに指定することで実現する（リポジトリ設定側の作業）。
on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    # ローカルのcompose.yamlと同じイメージ・認証情報にしてある。
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: fxgame
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d fxgame"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # connectTestDB（internal/game）はこの環境変数を読む。未設定時のデフォルトと
      # 同じ接続先だが、CI環境であることを明示するためここでも設定しておく。
      DATABASE_URL: postgres://app:app@localhost:5432/fxgame?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # go install で入れたバイナリ（oapi-codegen・golang-migrate・golangci-lint）を
      # 使えるようにする。actions/setup-goはGOPATH/binを自動でPATHに追加しないため。
      - name: Add Go bin dir to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # sqlc generateはDB接続不要（db/migrationsのSQLファイルを読むだけ）だが、
      # バージョンはローカルで生成した internal/db/*.sql.go のヘッダー
      # （sqlc v1.31.1）に揃えてある。
      - name: Install sqlc
        uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: "1.31.1"

      # ローカルで生成した internal/apigen/api.gen.go のヘッダー
      # （oapi-codegen/v2 version v2.8.0）にバージョンを揃えてある。
      - name: Install oapi-codegen
        run: go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.0

      # migrateはCIでのマイグレーション適用にのみ使う（生成物には影響しないため
      # sqlc/oapi-codegenほど厳密なバージョン固定は不要。latestを使う）。
      - name: Install golang-migrate
        run: go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # make（Git Bash等では未インストールの場合がある）を使わず、Makefileの
      # genターゲットの中身をそのまま展開する（dev-guide.md §2のコマンド一覧参照）。
      - name: Generate code (oapi-codegen + sqlc + orval)
        run: |
          oapi-codegen -config api/oapi-codegen.yaml api/openapi.yaml
          (cd backend && sqlc generate)
          (cd frontend && npm run gen)

      # 生成コードの差分チェック（dev-guide.md §4「スキーマを変えたのに生成し忘れた
      # 状態を弾く」）。
      # 現状 internal/db・internal/apigen・frontend/src/api/generated は
      # .gitignore 対象のためgit差分としては現れず、このステップは実質
      # 「生成コマンド自体がエラーなく完走するか」の確認になる。将来これらを
      # コミットする運用に変えた場合に本来の目的（差分検知）で効くようになる。
      - name: Fail if generated code is out of date
        run: git diff --exit-code

      - name: Apply migrations
        run: migrate -path backend/db/migrations -database "$DATABASE_URL" up

      - name: go vet
        run: go vet ./...
        working-directory: backend

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: golangci-lint
        run: golangci-lint run ./...
        working-directory: backend

      - name: go test
        run: go test ./...
        working-directory: backend
