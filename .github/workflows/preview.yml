name: Preview

# issue #109 [DEPLOY-3]: PR ごとのプレビュー環境を Cloud Run に出し、URL を PR にコメントする。
#
# 本番（deploy.yml の fxgame）とは別のサービス fxgame-preview に、トラフィックを流さない
# リビジョンを pr-<番号> タグで出す。fxgame-preview は本番とは別の DB（Neon のブランチ）と
# 環境変数を持つため、マージ前のコードが本番 DB や本番の秘密情報に触れることはない。
# 準備手順と制約は dev-guide.md §2.1「プレビュー環境」 を参照。
#
# deploy.yml と同じく、CI が成功した後にだけ走る（workflow_run）。
# workflow_run はこのファイルを default ブランチ側のものを使って実行するため、
# PR 側でこのワークフロー自体を書き換えても、マージされるまでは反映されない。
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  # PR が閉じたときの後始末は pull_request_target で受ける。pull_request だと ref が
  # refs/pull/<番号>/merge になり、main ブランチだけを信頼する Workload Identity の
  # 条件（dev-guide.md §4）で認証が通らないため。PR のコードは checkout しないので安全。
  pull_request_target:
    types: [closed]

env:
  SERVICE: fxgame-preview
  REGION: asia-northeast1

jobs:
  deploy:
    runs-on: ubuntu-latest
    # pull_requests[0] は同じリポジトリのブランチからの PR でだけ埋まる（fork の PR は空）。
    # 念のため head_repository でも同じリポジトリであることを確かめる。
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0] != null &&
      vars.PREVIEW_ENABLED == 'true'

    # 同じ PR への push が続いたら、古いデプロイは取り消して最新だけを出す。
    concurrency:
      group: preview-pr-${{ github.event.workflow_run.pull_requests[0].number }}
      cancel-in-progress: true

    permissions:
      contents: read
      id-token: write # Workload Identity Federation に必要
      pull-requests: write # PR へのコメント
      issues: write # PR のコメントは Issue のコメントとして扱われる

    env:
      PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          # CI が実際に検証した PR のコミットを明示的に指定する。
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Add Go bin dir to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # deploy.yml と同じ理由で、バックエンドの生成コードを先に用意する
      # （gcloud は .gitignore を尊重しないため、生成しないと Cloud Build が失敗する）。
      - name: Install sqlc
        uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: "1.31.1"

      - name: Install oapi-codegen
        run: go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.0

      - name: Generate backend code (oapi-codegen + sqlc)
        run: |
          oapi-codegen -config api/oapi-codegen.yaml api/openapi.yaml
          (cd backend && sqlc generate)

      # プレビュー用 DB に PR のマイグレーションを適用する。
      # DB は全 PR で共有するため、マイグレーションを含む PR を閉じたら
      # Neon のブランチをリセットして戻す（dev-guide.md §2.1「プレビュー環境」）。
      - name: Install golang-migrate
        run: go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest

      - name: Apply migrations to preview DB
        env:
          PREVIEW_DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL }}
        run: migrate -path backend/db/migrations -database "$PREVIEW_DATABASE_URL" up

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      # --no-traffic: サービスの既定の URL には流さず、タグの URL でだけ開けるようにする。
      # 環境変数のフラグは付けない（fxgame-preview に手動で設定したものを引き継ぐ）。
      - name: Deploy preview revision
        run: |
          gcloud run deploy "$SERVICE" --source . \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "$REGION" \
            --no-traffic \
            --tag "pr-$PR_NUMBER" \
            --allow-unauthenticated \
            --quiet

      - name: Get preview URL
        id: url
        run: |
          url=$(gcloud run services describe "$SERVICE" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "$REGION" \
            --format=json | jq -r --arg tag "pr-$PR_NUMBER" '.status.traffic[] | select(.tag == $tag) | .url')
          if [ -z "$url" ]; then
            echo "pr-$PR_NUMBER のタグの URL が見つかりません" >&2
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # 2 回目以降の push では、新しいコメントを増やさず前回のコメントを書き換える。
      - name: Comment preview URL on PR
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.url.outputs.url }}
        run: |
          body=$(cat <<EOF
          ### プレビュー
          ${PREVIEW_URL}

          - コミット: \`${HEAD_SHA:0:7}\`
          - 本番とは別の環境（\`$SERVICE\`・プレビュー用 DB）で動いています
          - Discord ログインは使えません。tick が来ないので価格は動きません
          EOF
          )
          gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body "$body" --edit-last --create-if-none

  cleanup:
    runs-on: ubuntu-latest
    # PR が閉じたら（マージ・クローズとも）タグを外し、URL で開けないようにする。
    # リビジョン自体はトラフィックがなければ 0 台まで縮むので残しておいてよい。
    if: >
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.PREVIEW_ENABLED == 'true'

    permissions:
      contents: read
      id-token: write

    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      # CI が失敗してプレビューが出なかった PR では、タグが存在しないので何もしない。
      - name: Remove preview tag
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          tags=$(gcloud run services describe "$SERVICE" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "$REGION" \
            --format=json | jq -r '.status.traffic[].tag // empty')
          if ! grep -qx "pr-$PR_NUMBER" <<<"$tags"; then
            echo "pr-$PR_NUMBER のタグはありません"
            exit 0
          fi
          gcloud run services update-traffic "$SERVICE" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "$REGION" \
            --remove-tags "pr-$PR_NUMBER" \
            --quiet
