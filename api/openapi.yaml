openapi: 3.0.3
info:
  title: fxgame API
  version: "0.1.0"
  description: |
    Discord連携型FXトレーディングゲームのAPI契約。
    dev-guide.md のスキーマファースト方針に従い、実装より先にここへ定義する。
    Discord の /interactions は Discord 側が定義したスキーマのためここには書かない。

servers:
  - url: /api

paths:
  /api/me:
    get:
      operationId: getMe
      summary: ログイン中のユーザー情報を取得する
      tags: [me]
      security:
        - cookieAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          description: 未ログイン（sessionCookieが無い・期限切れ）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/currencies:
    get:
      operationId: listCurrencies
      summary: 通貨一覧（現在価格と前日比）を取得する
      tags: [market]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CurrencySummary"

  /api/currencies/{symbol}:
    get:
      operationId: getCurrency
      summary: 通貨1件の現在価格と前日比を取得する
      tags: [market]
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrencySummary"
        "404":
          description: 該当する通貨が存在しない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/currencies/{symbol}/candles:
    get:
      operationId: getCandles
      summary: 通貨のローソク足（1分足/5分足）と発火済みイベント注釈を取得する
      tags: [market]
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
        - name: resolution
          in: query
          required: true
          description: 足の種類（1分足/5分足）
          schema:
            type: string
            enum: [1m, 5m]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Candles"
        "400":
          description: resolution が 1m / 5m 以外
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 該当する通貨が存在しない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/market/status:
    get:
      operationId: getMarketStatus
      summary: 取引時間の状態（開催中か／残り時間／次の開始時刻）を取得する
      tags: [market]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketStatus"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session

  schemas:
    Me:
      type: object
      required:
        - discordId
        - displayName
        - balance
      properties:
        discordId:
          type: string
          description: Discord ユーザーID。usersテーブルの主キー
        displayName:
          type: string
        balance:
          type: string
          description: 残高（decimal文字列。CLAUDE.md §5.2 float禁止）

    CurrencySummary:
      type: object
      required:
        - symbol
        - name
        - currentPrice
        - dayChangePercent
      properties:
        symbol:
          type: string
        name:
          type: string
        currentPrice:
          type: string
          description: 現在価格（decimal文字列。CLAUDE.md §5.2 float禁止）
        dayChangePercent:
          type: string
          nullable: true
          description: 前日比（%）。「今日より前の直近セッションの最終close」が基準。
            小数2桁に丸めた文字列。基準が無ければ null

    MarketStatus:
      type: object
      required:
        - open
        - alwaysOpen
        - remainingMinutes
        - nextStartAt
      properties:
        open:
          type: boolean
          description: 取引時間中（開催中）かどうか
        alwaysOpen:
          type: boolean
          description: GAME_ALWAYS_OPEN（開発モード）が有効か
        remainingMinutes:
          type: integer
          nullable: true
          description: 開催中の残り時間（分）。時間外・常時開催なら null
        nextStartAt:
          type: string
          format: date-time
          nullable: true
          description: 時間外の場合の次の開始時刻（RFC3339）。開催中・常時開催なら null

    Candles:
      type: object
      required:
        - symbol
        - resolution
        - candles
        - events
      properties:
        symbol:
          type: string
        resolution:
          type: string
          description: 足の種類（"1m" または "5m"）
        candles:
          type: array
          items:
            $ref: "#/components/schemas/Candle"
        events:
          type: array
          description: すでに発火したイベントのみ（未来のイベントは返さない）
          items:
            $ref: "#/components/schemas/ChartEvent"

    Candle:
      type: object
      required:
        - time
        - open
        - high
        - low
        - close
        - basePrice
        - isOpening
      properties:
        time:
          type: string
          format: date-time
          description: この足の開始時刻（RFC3339）。1分足は ticked_at、5分足はバケット先頭
        open:
          type: string
          description: 始値（decimal文字列。CLAUDE.md §5.2 float禁止）
        high:
          type: string
        low:
          type: string
        close:
          type: string
        basePrice:
          type: string
          description: 人がいなかった場合の価格（decimal文字列。§3.4 の比較線）
        isOpening:
          type: boolean
          description: 寄り付きキャンドルか

    ChartEvent:
      type: object
      required:
        - time
        - type
        - magnitude
      properties:
        time:
          type: string
          format: date-time
          description: 発火時刻（RFC3339）
        type:
          type: string
          description: イベント種別（shock / vol_up / liquidity_drain）
        magnitude:
          type: string
          description: 効果の強さ（decimal文字列。shock は ±倍率、vol_up / liquidity_drain は倍率）

    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
