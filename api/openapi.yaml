openapi: 3.0.3
info:
  title: fxgame API
  version: "0.1.0"
  description: |
    Discord連携型FXトレーディングゲームのAPI契約。
    dev-guide.md のスキーマファースト方針に従い、実装より先にここへ定義する。
    Discord の /interactions は Discord 側が定義したスキーマのためここには書かない。

servers:
  - url: /api

paths:
  /api/me:
    get:
      operationId: getMe
      summary: ログイン中のユーザー情報を取得する
      tags: [me]
      security:
        - cookieAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          description: 未ログイン（sessionCookieが無い・期限切れ）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/currencies:
    get:
      operationId: listCurrencies
      summary: 通貨一覧（現在価格と前日比）を取得する
      tags: [market]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CurrencySummary"

  /api/currencies/{symbol}:
    get:
      operationId: getCurrency
      summary: 通貨1件の現在価格と前日比を取得する
      tags: [market]
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrencySummary"
        "404":
          description: 該当する通貨が存在しない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/currencies/{symbol}/candles:
    get:
      operationId: getCandles
      summary: 通貨のローソク足（1分足/5分足）と発火済みイベント注釈を取得する
      tags: [market]
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
        - name: resolution
          in: query
          required: true
          description: 足の種類（1分足/5分足）
          schema:
            type: string
            enum: [1m, 5m]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Candles"
        "400":
          description: resolution が 1m / 5m 以外
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 該当する通貨が存在しない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/market/status:
    get:
      operationId: getMarketStatus
      summary: 取引時間の状態（開催中か／残り時間／次の開始時刻）を取得する
      tags: [market]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketStatus"

  /api/orders:
    post:
      operationId: placeOrder
      summary: 成行の新規注文を発注する
      tags: [trade]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderRequest"
      responses:
        "200":
          description: 注文成立
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResult"
        "400":
          description: 入力が不正（売買方向・数量・レバレッジ）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: 未ログイン（sessionCookieが無い・期限切れ）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 該当する通貨が存在しない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: 残高不足・レバレッジ超過・新規注文受付時間外
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/positions:
    get:
      operationId: listPositions
      summary: ログイン中ユーザーの未決済ポジション一覧（含み損益込み）を取得する
      tags: [trade]
      security:
        - cookieAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Position"
        "401":
          description: 未ログイン（sessionCookieが無い・期限切れ）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/positions/{positionId}/close:
    post:
      operationId: closePosition
      summary: 既存ポジションを決済する
      tags: [trade]
      security:
        - cookieAuth: []
      parameters:
        - name: positionId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 決済完了
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloseResult"
        "401":
          description: 未ログイン（sessionCookieが無い・期限切れ）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 該当するポジションが存在しない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: すでに決済済み
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/replay/games:
    post:
      operationId: startReplayGame
      summary: 過去チャートモードのゲームを開始する（ログイン不要・ゲスト可）
      tags: [replay]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplayStartRequest"
      responses:
        "200":
          description: ゲーム開始（トークンを返す。以降の操作はこのトークンで行う）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayGameStarted"
        "400":
          description: ゲスト名が不正（未ログインで 1〜16 文字でない）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: 開始できる区間が無い（取り込み済みデータ不足）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/replay/games/{gameId}:
    get:
      operationId: getReplayGameState
      summary: 過去チャートモードのゲーム状態を取得する
      tags: [replay]
      security:
        - bearerAuth: []
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayGameState"
        "401":
          description: トークンが無い・不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: ゲームが存在しない（またはトークンが合わない）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/replay/games/{gameId}/orders:
    post:
      operationId: placeReplayOrder
      summary: 過去チャートモードで注文する
      tags: [replay]
      security:
        - bearerAuth: []
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplayOrderRequest"
      responses:
        "200":
          description: 注文成立
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayOrderResult"
        "400":
          description: 入力が不正（売買方向・証拠金・レバレッジ）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: トークンが無い・不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: ゲーム・通貨ペアが存在しない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: 残高不足・レバレッジ超過・ゲーム終了済み・反対方向の建玉あり
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/replay/games/{gameId}/positions/{positionId}/close:
    post:
      operationId: closeReplayPosition
      summary: 過去チャートモードの建玉を決済する
      tags: [replay]
      security:
        - bearerAuth: []
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: positionId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 決済完了
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayCloseResult"
        "401":
          description: トークンが無い・不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: ゲーム・建玉が存在しない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: すでに決済済み・ゲーム終了済み
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/replay/games/{gameId}/positions/{positionId}/margin:
    post:
      operationId: addReplayMargin
      summary: 過去チャートモードの建玉に証拠金を追加する
      tags: [replay]
      security:
        - bearerAuth: []
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: positionId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplayAddMarginRequest"
      responses:
        "200":
          description: 追加完了
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayAddMarginResult"
        "400":
          description: 追加額が不正（1 以上の整数でない）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: トークンが無い・不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: ゲーム・建玉が存在しない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: 残高不足・すでに決済済み・ゲーム終了済み
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/replay/games/{gameId}/leverage:
    post:
      operationId: unlockReplayLeverage
      summary: 過去チャートモードで通貨ペアのレバレッジ上限を解放する
      tags: [replay]
      security:
        - bearerAuth: []
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplayUnlockLeverageRequest"
      responses:
        "200":
          description: 解放完了
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayUnlockLeverageResult"
        "401":
          description: トークンが無い・不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: ゲーム・通貨ペアが存在しない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: 残高不足・ゲーム終了済み
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/replay/games/{gameId}/speed:
    post:
      operationId: changeReplaySpeed
      summary: 過去チャートモードの速さを変更する
      tags: [replay]
      security:
        - bearerAuth: []
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplayChangeSpeedRequest"
      responses:
        "200":
          description: 変更完了
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayChangeSpeedResult"
        "400":
          description: 速さが不正（1/2/3 以外）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: トークンが無い・不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: ゲームが存在しない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: ゲーム終了済み
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
    bearerAuth:
      type: http
      scheme: bearer
      description: "過去チャートモードのゲームトークン（開始時に発行。Authorization: Bearer <token> で送る）"

  schemas:
    Me:
      type: object
      required:
        - discordId
        - displayName
        - balance
      properties:
        discordId:
          type: string
          description: Discord ユーザーID。usersテーブルの主キー
        displayName:
          type: string
        balance:
          type: string
          description: 残高（decimal文字列。CLAUDE.md §5.2 float禁止）

    CurrencySummary:
      type: object
      required:
        - symbol
        - name
        - currentPrice
        - dayChangePercent
      properties:
        symbol:
          type: string
        name:
          type: string
        currentPrice:
          type: string
          description: 現在価格（decimal文字列。CLAUDE.md §5.2 float禁止）
        dayChangePercent:
          type: string
          nullable: true
          description: 前日比（%）。「今日より前の直近セッションの最終close」が基準。
            小数2桁に丸めた文字列。基準が無ければ null

    MarketStatus:
      type: object
      required:
        - open
        - alwaysOpen
        - remainingMinutes
        - nextStartAt
      properties:
        open:
          type: boolean
          description: 取引時間中（開催中）かどうか
        alwaysOpen:
          type: boolean
          description: GAME_ALWAYS_OPEN（開発モード）が有効か
        remainingMinutes:
          type: integer
          nullable: true
          description: 開催中の残り時間（分）。時間外・常時開催なら null
        nextStartAt:
          type: string
          format: date-time
          nullable: true
          description: 時間外の場合の次の開始時刻（RFC3339）。開催中・常時開催なら null

    Candles:
      type: object
      required:
        - symbol
        - resolution
        - candles
        - events
      properties:
        symbol:
          type: string
        resolution:
          type: string
          description: 足の種類（"1m" または "5m"）
        candles:
          type: array
          items:
            $ref: "#/components/schemas/Candle"
        events:
          type: array
          description: すでに発火したイベントのみ（未来のイベントは返さない）
          items:
            $ref: "#/components/schemas/ChartEvent"

    Candle:
      type: object
      required:
        - time
        - open
        - high
        - low
        - close
        - basePrice
        - isOpening
      properties:
        time:
          type: string
          format: date-time
          description: この足の開始時刻（RFC3339）。1分足は ticked_at、5分足はバケット先頭
        open:
          type: string
          description: 始値（decimal文字列。CLAUDE.md §5.2 float禁止）
        high:
          type: string
        low:
          type: string
        close:
          type: string
        basePrice:
          type: string
          description: 人がいなかった場合の価格（decimal文字列。§3.4 の比較線）
        isOpening:
          type: boolean
          description: 寄り付きキャンドルか

    ChartEvent:
      type: object
      required:
        - time
        - type
        - magnitude
      properties:
        time:
          type: string
          format: date-time
          description: 発火時刻（RFC3339）
        type:
          type: string
          description: イベント種別（shock / vol_up / liquidity_drain）
        magnitude:
          type: string
          description: 効果の強さ（decimal文字列。shock は ±倍率、vol_up / liquidity_drain は倍率）

    OrderRequest:
      type: object
      required:
        - symbol
        - side
        - size
        - leverage
      properties:
        symbol:
          type: string
        side:
          type: string
          enum: [long, short]
        size:
          type: string
          description: 建玉数量（decimal文字列。CLAUDE.md §5.2 float禁止）
        leverage:
          type: string
          description: レバレッジ（decimal文字列。CLAUDE.md §5.2 float禁止）

    OrderResult:
      type: object
      required:
        - symbol
        - side
        - size
        - entryPrice
        - leverage
        - newBalance
      properties:
        symbol:
          type: string
        side:
          type: string
        size:
          type: string
        entryPrice:
          type: string
          description: 約定価格（decimal文字列）
        leverage:
          type: string
        newBalance:
          type: string
          description: 発注後の残高（decimal文字列）

    Position:
      type: object
      required:
        - id
        - symbol
        - side
        - size
        - entryPrice
        - leverage
        - currentPrice
        - unrealizedPnl
        - openedAt
      properties:
        id:
          type: integer
          format: int64
        symbol:
          type: string
        side:
          type: string
        size:
          type: string
        entryPrice:
          type: string
          description: 建値（decimal文字列）
        leverage:
          type: string
        currentPrice:
          type: string
          description: 現在価格（decimal文字列）
        unrealizedPnl:
          type: string
          description: 含み損益（decimal文字列）
        openedAt:
          type: string
          format: date-time

    CloseResult:
      type: object
      required:
        - pnl
        - newBalance
      properties:
        pnl:
          type: string
          description: 確定損益（decimal文字列）
        newBalance:
          type: string
          description: 決済後の残高（decimal文字列）

    ReplayStartRequest:
      type: object
      properties:
        guestName:
          type: string
          description: ゲスト名（未ログイン時のみ必須。前後の空白を除いて 1〜16 文字）

    ReplayGameStarted:
      type: object
      required:
        - gameId
        - token
        - startYear
        - funds
        - speed
        - publishedDays
        - pairs
        - candlesByPair
      properties:
        gameId:
          type: integer
          format: int64
        token:
          type: string
          description: "ゲームトークン。以降の操作は Authorization: Bearer <token> で行う"
        startYear:
          type: integer
          description: 開始年（終了までは年だけ公開。design.md §13）
        funds:
          type: string
        speed:
          type: integer
        publishedDays:
          type: integer
          description: 公開済みの区間営業日数（0..60）
        pairs:
          type: array
          items:
            $ref: "#/components/schemas/ReplayPair"
        candlesByPair:
          type: array
          items:
            $ref: "#/components/schemas/ReplayPairCandles"

    ReplayPair:
      type: object
      required:
        - pairId
        - symbol
        - baseLeverage
        - maxLeverage
        - feeRate
      properties:
        pairId:
          type: integer
          format: int64
        symbol:
          type: string
        baseLeverage:
          type: string
          description: 初期のレバレッジ上限（通貨ペアの行の値）
        maxLeverage:
          type: string
          description: 現在のレバレッジ上限（上限解放を反映した値）
        feeRate:
          type: string
          description: 片道手数料率（decimal文字列）

    ReplayCandle:
      type: object
      required:
        - day
        - open
        - high
        - low
        - close
      properties:
        day:
          type: integer
          description: 通し番号（0..79）。0〜19 が開始前 20 日、20〜79 が区間 60 日
        open:
          type: string
        high:
          type: string
        low:
          type: string
        close:
          type: string
        date:
          type: string
          format: date
          nullable: true
          description: 終了後にのみセットされる正確な日付（終了前は常に null）

    ReplayPairCandles:
      type: object
      required:
        - pairId
        - candles
      properties:
        pairId:
          type: integer
          format: int64
        candles:
          type: array
          items:
            $ref: "#/components/schemas/ReplayCandle"

    ReplayPosition:
      type: object
      required:
        - id
        - pairId
        - symbol
        - side
        - initialMargin
        - margin
        - leverage
        - entryPrice
        - entryDay
        - liquidationLine
        - status
      properties:
        id:
          type: integer
          format: int64
        pairId:
          type: integer
          format: int64
        symbol:
          type: string
        side:
          type: string
          description: long / short
        initialMargin:
          type: string
          description: 建玉時の証拠金（取引規模・手数料の基準）
        margin:
          type: string
          description: 現在の証拠金（追加分込み）
        leverage:
          type: integer
        entryPrice:
          type: string
        entryDay:
          type: integer
          description: 建てた日（通し番号 0..79）
        liquidationLine:
          type: string
          description: 強制決済ライン（買いは安値・売りは高値が届くと強制決済）
        status:
          type: string
          description: open / closed / liquidated
        closePrice:
          type: string
          nullable: true
        pnl:
          type: string
          nullable: true
          description: 損益（証拠金 × レバレッジ × 価格変化率。負値は損失）

    ReplayGameState:
      type: object
      required:
        - gameId
        - status
        - startYear
        - funds
        - speed
        - publishedDays
        - pairs
        - positions
        - candlesByPair
      properties:
        gameId:
          type: integer
          format: int64
        status:
          type: string
          description: playing / finished / early_finished
        startYear:
          type: integer
        funds:
          type: string
        speed:
          type: integer
        publishedDays:
          type: integer
        pairs:
          type: array
          items:
            $ref: "#/components/schemas/ReplayPair"
        positions:
          type: array
          items:
            $ref: "#/components/schemas/ReplayPosition"
        candlesByPair:
          type: array
          items:
            $ref: "#/components/schemas/ReplayPairCandles"
        intervalStart:
          type: string
          format: date
          nullable: true
          description: 区間の開始日（終了後にのみセット）
        intervalEnd:
          type: string
          format: date
          nullable: true
          description: 区間の終了日（終了後にのみセット）
        finalFunds:
          type: string
          nullable: true
          description: スコア（最終資金。終了後にのみセット）

    ReplayOrderRequest:
      type: object
      required:
        - pairId
        - side
        - margin
        - leverage
      properties:
        pairId:
          type: integer
          format: int64
        side:
          type: string
          enum: [long, short]
        margin:
          type: string
          description: 証拠金（1 以上の整数）
        leverage:
          type: string
          description: レバレッジ（1 以上の整数）

    ReplayOrderResult:
      type: object
      required:
        - position
        - funds
      properties:
        position:
          $ref: "#/components/schemas/ReplayPosition"
        funds:
          type: string

    ReplayCloseResult:
      type: object
      required:
        - position
        - pnl
        - funds
      properties:
        position:
          $ref: "#/components/schemas/ReplayPosition"
        pnl:
          type: string
        funds:
          type: string

    ReplayAddMarginRequest:
      type: object
      required:
        - amount
      properties:
        amount:
          type: string
          description: 追加する証拠金（1 以上の整数）

    ReplayAddMarginResult:
      type: object
      required:
        - position
        - funds
      properties:
        position:
          $ref: "#/components/schemas/ReplayPosition"
        funds:
          type: string

    ReplayUnlockLeverageRequest:
      type: object
      required:
        - pairId
      properties:
        pairId:
          type: integer
          format: int64

    ReplayUnlockLeverageResult:
      type: object
      required:
        - pairId
        - tier
        - maxLeverage
        - cost
        - funds
      properties:
        pairId:
          type: integer
          format: int64
        tier:
          type: integer
          description: 解放後の段数
        maxLeverage:
          type: string
          description: 解放後のレバレッジ上限
        cost:
          type: string
          description: 今回の費用
        funds:
          type: string

    ReplayChangeSpeedRequest:
      type: object
      required:
        - speed
      properties:
        speed:
          type: integer
          description: 1 / 2 / 3

    ReplayChangeSpeedResult:
      type: object
      required:
        - speed
        - publishedDays
      properties:
        speed:
          type: integer
        publishedDays:
          type: integer

    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
